# ============================================================
#  学生工作管理系统 —— Nginx 站点配置
# ============================================================
#  放哪：
#    CentOS / 宝塔面板： /etc/nginx/conf.d/zuoye.conf
#    Ubuntu / Debian   ： /etc/nginx/sites-available/zuoye
#                        （再 ln -s 到 sites-enabled/）
#
#  改完一定要先测再重启：
#    nginx -t && sudo systemctl reload nginx
# ============================================================

server {
    listen 80;
    server_name 47.114.62.248;

    # ---------- ① 前端：Vite 打包出来的静态文件 ----------
    # 本机 `npm run build` 出来的 dist/ 整个传到这个目录
    root /var/www/zuoye;
    index index.html;

    # ⚠️ 这一行是 SPA 的命门，不能少。
    #    少了它，直接访问 /todo、/leave 这些子路由会 404 ——
    #    因为这些文件在服务器上根本不存在，是前端路由自己画的。
    #    实测：少了 try_files，刷新待办页就是白屏 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite 打包出来的文件名带 hash，内容变了文件名就变，所以可以长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- ② /api 转发给本机的 Flask 代理 ----------
    # 管两件事：AI 助手对话、打卡的「坐标变地名」
    # 不挂这一段也能跑，只是 AI 只剩本地规则、打卡只显示坐标
    location /api/ {
        proxy_pass http://127.0.0.1:5000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 本机模型冷启动要读 4.4GB，慢得很，别让 nginx 提前掐断
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }
}

